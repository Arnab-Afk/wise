[SERVICE]
    Flush        2
    Parsers_File /fluent-bit/etc/lab-parsers.conf
[INPUT]
    Name   tail
    Path   /logs/*.log
    Parser json
    Tag    lab.*
    Read_from_Head false
    Refresh_Interval 2
# to Tracewise, plain JSON over HTTP
[OUTPUT]
    Name   http
    Match  lab.*
    Host   api
    Port   8000
    URI    /v1/ingest/logs
    Format json
    Header x-ingest-key __KEY__
    compress gzip
# to Tracewise, Elasticsearch bulk API
[OUTPUT]
    Name   es
    Match  lab.*
    Host   api
    Port   8000
    Path   /es
    HTTP_User tracewise
    HTTP_Passwd __KEY__
    Suppress_Type_Name On
    Index  lab
# to a real OpenSearch (which Tracewise then pulls from)
[OUTPUT]
    Name   opensearch
    Match  lab.*
    Host   lab-opensearch
    Port   9200
    Index  lab-logs
    Suppress_Type_Name On
