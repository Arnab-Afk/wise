server: {http_listen_port: 9080, grpc_listen_port: 0}
positions: {filename: /tmp/positions.yaml}
clients:
  - url: http://lab-loki:3100/loki/api/v1/push
  - url: http://api:8000/loki/api/v1/push      # Tracewise speaks the Loki push protocol
    bearer_token: __KEY__
scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters: [{name: label, values: ["lab=1"]}]
    relabel_configs:
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: app
